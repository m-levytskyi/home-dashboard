<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <title>Home Dashboard</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f0e9;
      color: #191919;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      transition: background-color .35s ease, color .35s ease;
    }

    html { height: 100%; }

    * { box-sizing: border-box; }

    body {
      padding: 28px;
      overflow-x: hidden;
    }

    #dashboard {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      -webkit-transition: -webkit-transform 1.2s ease;
      transition: transform 1.2s ease;
    }

    .top {
      border-bottom: 1px solid rgba(0,0,0,.18);
      padding-bottom: 22px;
      margin-bottom: 25px;
      position: relative;
    }

    .night-toggle {
      position: absolute;
      top: 3px;
      right: 0;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      color: #34342f;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .night-toggle svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 23px;
      height: 23px;
      margin: -11.5px 0 0 -11.5px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .night-toggle:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .time-line {
      display: block;
      width: 100%;
      padding-top: 50px;
    }

    #time {
      display: inline-block;
      max-width: none;
      font-size: 245px;
      font-weight: 300;
      letter-spacing: -12px;
      line-height: .86;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      -webkit-font-feature-settings: "tnum";
      font-feature-settings: "tnum";
    }

    #date {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 400;
      color: #5b5b55;
    }

    .sun-times {
      display: table;
      width: 100%;
      table-layout: fixed;
      color: #5b5b55;
      font-size: 17px;
      line-height: 1.3;
      margin-top: 14px;
    }

    .sun-time {
      display: table-cell;
      width: 50%;
      white-space: nowrap;
    }

    .sun-time:last-child { text-align: right; }

    .sun-symbol {
      display: inline-block;
      width: 31px;
      height: 19px;
      vertical-align: -4px;
    }

    .sun-symbol svg,
    .weather-icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .section {
      border-bottom: 1px solid rgba(0,0,0,.18);
      padding: 0 0 24px;
      margin: 0 0 24px;
    }

    .section:last-child { border-bottom: 0; }

    .label {
      margin-bottom: 14px;
      color: #686861;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .weather-now {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .weather-icon {
      font-size: 38px;
      line-height: 1;
      width: 42px;
      height: 42px;
      text-align: center;
    }

    .weather-temp {
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -3px;
      line-height: .95;
      color: #000;
      white-space: nowrap;
    }

    .weather-range {
      text-align: right;
      min-width: 92px;
    }

    .range-high,
    .range-low {
      font-size: 24px;
      line-height: 1.1;
      color: #292925;
    }

    .range-low {
      color: #5f5f58;
      margin-top: 6px;
    }

    .muted {
      color: #676760;
      font-size: 16px;
      line-height: 1.45;
    }

    .weather-details {
      display: table;
      width: 100%;
      table-layout: fixed;
      margin-top: 22px;
    }

    .weather-detail {
      display: table-cell;
      width: 33%;
      padding-right: 8px;
    }

    .weather-detail strong {
      display: block;
      font-size: 19px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .weather-detail span {
      color: #73736c;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .info-pair {
      display: table;
      width: 100%;
      table-layout: fixed;
    }

    .info-card {
      display: table-cell;
      width: 50%;
      vertical-align: top;
      padding-right: 24px;
    }

    .info-card:last-child { padding-right: 0; }

    .info-title {
      font-size: 20px;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .info-date {
      color: #62625c;
      font-size: 16px;
      line-height: 1.4;
    }

    .info-note {
      color: #85857d;
      font-size: 12px;
      margin-top: 5px;
    }

    .departures {
      width: 100%;
      border-collapse: collapse;
    }

    .departures td {
      padding: 10px 0;
      border-top: 1px solid rgba(0,0,0,.09);
      vertical-align: middle;
    }

    .departures tr:first-child td { border-top: 0; }

    .line {
      width: 68px;
      font-size: 19px;
      font-weight: 600;
    }

    .destination {
      font-size: 17px;
      padding-right: 8px !important;
    }

    .minutes {
      width: 72px;
      text-align: right;
      font-size: 18px;
      white-space: nowrap;
    }

    .late {
      display: block;
      color: #846135;
      font-size: 11px;
      margin-top: 2px;
    }

    .error, .loading {
      color: #74746c;
      font-size: 15px;
      line-height: 1.5;
      padding: 8px 0;
    }

    #updated {
      text-align: center;
      color: #86867f;
      font-size: 11px;
      padding: 5px 0 12px;
    }

    html.night-mode,
    body.night-mode {
      background: #080a0e;
      color: #f2f0e8;
    }

    body.night-mode .top,
    body.night-mode .section {
      border-bottom-color: rgba(255,255,255,.16);
    }

    body.night-mode #date,
    body.night-mode .label,
    body.night-mode .muted,
    body.night-mode .range-low,
    body.night-mode .sun-times,
    body.night-mode .info-date,
    body.night-mode .info-note,
    body.night-mode .weather-detail span,
    body.night-mode .error,
    body.night-mode .loading,
    body.night-mode #updated {
      color: #a9a69c;
    }

    body.night-mode .weather-temp,
    body.night-mode .range-high,
    body.night-mode .weather-detail strong {
      color: #fffaf0;
    }

    body.night-mode .departures td {
      border-top-color: rgba(255,255,255,.12);
    }

    body.night-mode .late {
      color: #e1b06e;
    }

    body.night-mode .night-toggle {
      border-color: rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #f4df8b;
    }

    @media (min-width: 900px) and (max-width: 1100px) and (orientation: landscape) {
      body { padding: 18px 24px; }

      #dashboard {
        display: table;
        width: 100%;
        max-width: none;
        table-layout: fixed;
      }

      .left-column,
      .right-column {
        display: table-cell;
        vertical-align: top;
      }

      .left-column {
        width: 42%;
        padding-right: 26px;
      }

      .right-column {
        width: 58%;
        padding-left: 26px;
        border-left: 1px solid rgba(0,0,0,.18);
      }

      .top,
      .section {
        padding-bottom: 16px;
        margin-bottom: 16px;
      }

      #time {
        font-size: 140px;
        letter-spacing: -7px;
      }

      #date {
        margin-top: 8px;
        font-size: 20px;
      }

      .sun-times {
        font-size: 16px;
        margin-top: 10px;
      }

      .night-toggle {
        top: 0;
        width: 38px;
        height: 38px;
      }

      .weather-temp {
        font-size: 60px;
        letter-spacing: -2px;
      }

      .weather-icon {
        width: 36px;
        height: 36px;
        font-size: 32px;
      }

      .weather-details {
        margin-top: 16px;
      }

      .weather-detail strong {
        font-size: 17px;
      }

      .info-title {
        font-size: 18px;
      }

      .info-date {
        font-size: 15px;
      }

      .departures td {
        padding: 8px 0;
      }

      .line {
        width: 58px;
        font-size: 18px;
      }

      .destination {
        font-size: 16px;
      }

      .minutes {
        width: 70px;
        font-size: 17px;
      }

      .right-column .section:last-of-type {
        border-bottom: 0;
        margin-bottom: 6px;
        padding-bottom: 0;
      }

      #updated {
        text-align: right;
        padding-bottom: 0;
      }

      body.night-mode .right-column {
        border-left-color: rgba(255,255,255,.16);
      }
    }

    @media (max-width: 500px) {
      body { padding: 20px; }
      #time { font-size: 125px; letter-spacing: -6px; }
      .sun-times { font-size: 15px; margin-top: 10px; }
      .sun-symbol { width: 28px; }
      .weather-temp { font-size: 58px; }
      .weather-icon { font-size: 32px; width: 36px; height: 36px; }
      .range-high, .range-low { font-size: 20px; }
      .weather-detail strong { font-size: 16px; }
      .info-pair, .info-card { display: block; width: 100%; }
      .info-card { padding: 0 0 20px; }
      .info-card:last-child { padding-bottom: 0; }
    }
  </style>
</head>
<body>
  <main id="dashboard">
    <div class="left-column">
      <header class="top">
        <button class="night-toggle" id="night-toggle" type="button" aria-label="Nachtmodus aktivieren" aria-pressed="false" title="Nachtmodus aktivieren"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M28.5 28.5A13 13 0 0 1 13 11a13 13 0 1 0 15.5 17.5Z"/></svg></button>
        <div class="time-line">
          <div id="time">--:--</div>
          <div class="sun-times">
            <div class="sun-time" aria-label="Sonnenaufgang">
              <span class="sun-symbol" aria-hidden="true"><svg viewBox="0 0 30 18" focusable="false"><path d="M2 14.5h26M7 14.5a6 6 0 0 1 12 0M13 5V2M7.5 7.5 5.5 5.5M18.5 7.5l2-2M25 11V3M22.5 5.5 25 3l2.5 2.5"/></svg></span><span id="sunrise">--:--</span>
            </div>
            <div class="sun-time" aria-label="Sonnenuntergang">
              <span class="sun-symbol" aria-hidden="true"><svg viewBox="0 0 30 18" focusable="false"><path d="M2 14.5h26M7 14.5a6 6 0 0 1 12 0M13 5V2M7.5 7.5 5.5 5.5M18.5 7.5l2-2M25 3v8M22.5 8.5 25 11l2.5-2.5"/></svg></span><span id="sunset">--:--</span>
            </div>
          </div>
        </div>
        <div id="date">Wird geladen…</div>
      </header>

      <section class="section">
        <div class="label">Wetter</div>

        <div class="weather-main">
          <div class="weather-now">
            <div class="weather-icon" id="weather-icon"></div>
            <div class="weather-temp" id="temperature">--°</div>
          </div>
          <div class="weather-range">
            <div class="range-high" id="temp-high">--°</div>
            <div class="range-low" id="temp-low">--°</div>
          </div>
        </div>

        <div class="weather-details">
          <div class="weather-detail">
            <strong id="rain-now">--%</strong>
            <span>Regen heute</span>
          </div>
          <div class="weather-detail">
            <strong id="wind">-- km/h</strong>
            <span>Wind max</span>
          </div>
          <div class="weather-detail">
            <strong id="uv-index">--</strong>
            <span>UV max</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="info-pair">
          <div class="info-card">
            <div class="label">Feiertag</div>
            <div id="public-holiday" class="loading">Feiertage werden geladen…</div>
          </div>
          <div class="info-card">
            <div class="label">Schulferien</div>
            <div id="school-holiday" class="loading">Schulferien werden geladen…</div>
          </div>
        </div>
      </section>
    </div>

    <div class="right-column">
      <section class="section">
        <div class="label">U-Bahn</div>
        <div id="departures-u6" class="loading">Abfahrten werden geladen…</div>
      </section>

      <section class="section">
        <div class="label">Tram</div>
        <div id="departures-tram" class="loading">Abfahrten werden geladen…</div>
      </section>

      <div id="updated">Wird gestartet…</div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var WEATHER_QUERY =
        "?latitude=48.113&longitude=11.481" +
        "&current=temperature_2m,weather_code" +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,wind_speed_10m_max,sunrise,sunset" +
        "&timezone=Europe%2FBerlin&forecast_days=3";
      var WEATHER_URL =
        "https://api.open-meteo.com/v1/forecast" + WEATHER_QUERY;

      var TRANSPORT_BASE = "https://mvv-worker.mykhailo-levytskyi.workers.dev";
      var WEATHER_PROXY_URL = TRANSPORT_BASE + "/weather" + WEATHER_QUERY;
      var HOLIDAY_BASE = "https://openholidaysapi.org";
      var HOLIDAY_PROXY_BASE = TRANSPORT_BASE + "/holidays";

      var stopConfigs = [
        {
          query: "Haderner Stern, München",
          target: "departures-u6",
          mode: "subway",
          line: "U6",
          maximum: 5
        },
        {
          query: "Gondrellplatz, München",
          target: "departures-tram",
          mode: "tram",
          line: "",
          maximum: 5
        }
      ];

      var resolvedStops = {};
      var sunrises = [];
      var sunsets = [];
      var nightModeTimer = null;
      var manualNightMode = false;

      function requestJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        var completed = false;

        function finish(error, data) {
          if (completed) return;
          completed = true;
          callback(error, data);
        }

        xhr.open("GET", url, true);
        xhr.timeout = 15000;

        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;

          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              finish(null, JSON.parse(xhr.responseText));
            } catch (error) {
              finish(new Error("Ungültige Antwort"));
            }
          } else {
            finish(new Error("Anfrage fehlgeschlagen: " + xhr.status));
          }
        };

        xhr.onerror = function () {
          finish(new Error("Netzwerkfehler"));
        };

        xhr.ontimeout = function () {
          finish(new Error("Zeitüberschreitung"));
        };

        xhr.send();
      }

      function pad(number) {
        return number < 10 ? "0" + number : String(number);
      }

      function updateClock() {
        var now = new Date();
        var days = [
          "Sonntag", "Montag", "Dienstag", "Mittwoch",
          "Donnerstag", "Freitag", "Samstag"
        ];
        var months = [
          "Januar", "Februar", "März", "April", "Mai", "Juni",
          "Juli", "August", "September", "Oktober", "November", "Dezember"
        ];

        document.getElementById("time").innerHTML =
          pad(now.getHours()) + ":" + pad(now.getMinutes());

        document.getElementById("date").innerHTML =
          days[now.getDay()] + ", " +
          now.getDate() + " " +
          months[now.getMonth()] + " " +
          now.getFullYear();
      }

      function fitClock() {
        var clock = document.getElementById("time");
        var line = clock && clock.parentNode;
        if (!clock || !line || !line.clientWidth) return;

        var baseSize = 320;
        clock.style.fontSize = baseSize + "px";
        clock.style.letterSpacing = "-16px";

        var measuredWidth = clock.offsetWidth;
        if (!measuredWidth) return;

        var fittedSize = Math.floor(
          baseSize * (line.clientWidth / measuredWidth) * 0.99
        );
        clock.style.fontSize = fittedSize + "px";
        clock.style.letterSpacing =
          "-" + Math.max(6, Math.round(fittedSize / 20)) + "px";
      }

      function weatherText(code) {
        var labels = {
          0: "Klar",
          1: "Überwiegend klar",
          2: "Teilweise bewölkt",
          3: "Bedeckt",
          45: "Nebel",
          48: "Raureifnebel",
          51: "Leichter Nieselregen",
          53: "Nieselregen",
          55: "Starker Nieselregen",
          56: "Gefrierender Nieselregen",
          57: "Starker gefrierender Nieselregen",
          61: "Leichter Regen",
          63: "Regen",
          65: "Starker Regen",
          66: "Gefrierender Regen",
          67: "Starker gefrierender Regen",
          71: "Leichter Schneefall",
          73: "Schneefall",
          75: "Starker Schneefall",
          77: "Schneegriesel",
          80: "Leichte Regenschauer",
          81: "Regenschauer",
          82: "Starke Regenschauer",
          85: "Schneeschauer",
          86: "Starke Schneeschauer",
          95: "Gewitter",
          96: "Gewitter mit Hagel",
          99: "Starkes Gewitter"
        };
        return labels[code] || "Wetter";
      }

      function weatherIcon(code) {
        var value = Number(code);
        var type = "unknown";
        if (value === 0 || value === 1) type = "sun";
        else if (value === 2) type = "partly-cloudy";
        else if (value === 3) type = "cloud";
        else if (value === 45 || value === 48) type = "fog";
        if ((value >= 51 && value <= 67) || (value >= 80 && value <= 82)) {
          type = "rain";
        }
        if (value >= 71 && value <= 77) type = "snow";
        if (value === 85 || value === 86) type = "snow";
        if (value >= 95) type = "storm";
        return weatherIconSVG(type);
      }

      function weatherIconSVG(type) {
        var paths = {
          sun: '<circle cx="20" cy="20" r="6"/><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5 32 32M32 8l-3.5 3.5M11.5 28.5 8 32"/>',
          "partly-cloudy": '<circle cx="14" cy="14" r="5"/><path d="M14 3v3M3 14h3M6 6l2.2 2.2M22 6l-2.2 2.2M11 29h19a6 6 0 0 0 0-12 9 9 0 0 0-17-1A6.5 6.5 0 0 0 11 29Z"/>',
          cloud: '<path d="M9 30h22a7 7 0 0 0 0-14 10 10 0 0 0-19-1A8 8 0 0 0 9 30Z"/>',
          fog: '<path d="M9 23h22a6 6 0 0 0 0-12 9 9 0 0 0-17-1A7 7 0 0 0 9 23ZM5 29h24M11 35h24"/>',
          rain: '<path d="M9 25h22a7 7 0 0 0 0-14 10 10 0 0 0-19-1A8 8 0 0 0 9 25ZM13 30l-2 5M21 30l-2 5M29 30l-2 5"/>',
          snow: '<path d="M9 23h22a7 7 0 0 0 0-14 10 10 0 0 0-19-1A8 8 0 0 0 9 23ZM12 29v7M9 31l6 3M15 31l-6 3M27 29v7M24 31l6 3M30 31l-6 3"/>',
          storm: '<path d="M9 23h22a7 7 0 0 0 0-14 10 10 0 0 0-19-1A8 8 0 0 0 9 23ZM21 27l-4 6h5l-3 6"/>',
          unknown: '<circle cx="20" cy="20" r="14"/><path d="M20 12v9M20 28v.5"/>'
        };
        return '<svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">' +
          paths[type] + '</svg>';
      }

      function timeFromISO(value) {
        if (!value) return "--:--";
        var match = /T(\d\d:\d\d)/.exec(value);
        return match ? match[1] : "--:--";
      }

      // iOS 9 Safari does not consistently parse ISO 8601 dates without seconds.
      // Construct local Open-Meteo timestamps explicitly instead of relying on it.
      function parseDateTime(value) {
        if (value instanceof Date) return new Date(value.getTime());
        if (!value) return null;

        var text = String(value);
        var match = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d)(?:\.(\d{1,3}))?)?(Z|[+-]\d\d:?\d\d)?$/.exec(text);
        var date;

        if (!match) {
          date = new Date(text);
          return isNaN(date.getTime()) ? null : date;
        }

        var milliseconds = match[7] ?
          Number((match[7] + "00").slice(0, 3)) : 0;

        if (!match[8]) {
          date = new Date(
            Number(match[1]), Number(match[2]) - 1, Number(match[3]),
            Number(match[4]), Number(match[5]), Number(match[6] || 0),
            milliseconds
          );
        } else {
          var timestamp = Date.UTC(
            Number(match[1]), Number(match[2]) - 1, Number(match[3]),
            Number(match[4]), Number(match[5]), Number(match[6] || 0),
            milliseconds
          );

          if (match[8] !== "Z") {
            var sign = match[8].charAt(0) === "+" ? 1 : -1;
            var offset = match[8].slice(1).replace(":", "");
            var offsetMinutes = Number(offset.slice(0, 2)) * 60 +
              Number(offset.slice(2, 4));
            timestamp -= sign * offsetMinutes * 60000;
          }
          date = new Date(timestamp);
        }

        return isNaN(date.getTime()) ? null : date;
      }

      function parseSunTime(value) {
        var date = parseDateTime(value);
        return date && !isNaN(date.getTime()) ? date : null;
      }

      function sameLocalDate(first, second) {
        return first.getFullYear() === second.getFullYear() &&
          first.getMonth() === second.getMonth() &&

      function localDateString(date) {

      function localizedHolidayName(item) {

      function holidayHasName(item, searchText) {

      function renderHoliday(targetId, items, school) {
        var today = new Date();
        today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        var active = null;
        var next = null;
        var i;

        for (i = 0; i < items.length; i++) {
          var start = parseDateOnly(items[i].startDate);
          var end = parseDateOnly(items[i].endDate);
          if (start <= today && end >= today) {
            active = items[i];
            break;
          }
          if (start > today && (!next || start < parseDateOnly(next.startDate))) {
            next = items[i];
          }
        }

        var item = active || next;
        if (!item) {
          document.getElementById(targetId).innerHTML =
            '<div class="error">Keine Termine verfügbar.</div>';
          return;

        var startDate = parseDateOnly(item.startDate);
        var endDate = parseDateOnly(item.endDate);
        var name = localizedHolidayName(item);
        var dateText = formatDate(startDate);
        if (school || item.startDate !== item.endDate) {
          dateText = formatDate(startDate) + "–" + formatDate(endDate);
        }

        var note;
        if (active) {
          note = school ? "Ferien laufen derzeit" : "Heute";

          '<div class="info-date">' + dateText + '</div>' +

      function loadHolidays() {

      function requestHoliday(type, directUrl, query, callback) {

      function productMode(departure) {
        function normalizedMode(value) {
          var key = String(value || "")
            .toLowerCase()
            .replace(/[\s_-]/g, "");
          if (!key) return "";
          if (key === "ubahn" || key === "subway" || key === "metro") {
            return "subway";
          }
          if (key === "tram" || key === "streetcar" || key === "str") {
            return "tram";
          }
          if (key === "bus" || key === "nightbus" || key === "nachtbus") {
            return "bus";
          }
          return key;
        }

        var product = departure.line && departure.line.product ?
          normalizedMode(departure.line.product) : "";

        var mode = departure.line && departure.line.mode ?
          normalizedMode(departure.line.mode) : "";

        var name = departure.line && departure.line.name ?
          String(departure.line.name).toUpperCase() : "";

        if (product === "subway" || mode === "subway" || /^U\d+/.test(name)) {
          return "subway";
        }
        if (product === "tram" || mode === "tram") {
          return "tram";
        }
        if (product === "bus" || mode === "bus") {
          return "bus";
        }
        return product || mode;
      }

      function matchesConfig(departure, config) {
        var name = departure.line && departure.line.name ?
          String(departure.line.name).toUpperCase().replace(/\s/g, "") : "";
        var mode = productMode(departure);

        if (config.line &&
            name !== config.line.toUpperCase().replace(/\s/g, "")) {
          return false;
        }

        if (mode === config.mode) return true;
        if (!mode && !config.line) return true;
        return false;
      }

      function departureDate(departure) {
        var value =
          departure.when ||
          departure.plannedWhen ||
          departure.departure ||
          departure.plannedDeparture;

        return parseDateTime(value);
      }

      function minutesUntil(date) {
        if (!date || isNaN(date.getTime())) return null;
        return Math.max(0, Math.round((date.getTime() - new Date().getTime()) / 60000));
      }

      function delayMinutes(departure) {
        if (typeof departure.delayMinutes === "number") {
          return departure.delayMinutes;
        }

        if (typeof departure.delay === "number") {
          return Math.round(departure.delay / 60);
        }

        var actual = departure.when || departure.departure;
        var planned = departure.plannedWhen || departure.plannedDeparture;

        if (actual && planned) {
          var actualDate = parseDateTime(actual);
          var plannedDate = parseDateTime(planned);
          if (!actualDate || !plannedDate) return 0;
          return Math.max(
            0,
            Math.round((actualDate.getTime() - plannedDate.getTime()) / 60000)
          );
        }

        return 0;
      }

      function lineName(departure) {
        if (departure.line) {
          return departure.line.name ||
            departure.line.fahrtNr ||
            departure.line.id ||
            "—";
        }
        return "—";
      }

      function destinationName(departure) {
        if (departure.direction) return departure.direction;
        if (departure.destination) {
          return departure.destination.name || departure.destination;
        }
        return "Unbekanntes Ziel";
      }

      function renderDepartures(targetId, departures, config) {
        var filtered = [];
        var i;

        for (i = 0; i < departures.length; i++) {
          if (matchesConfig(departures[i], config)) {
            filtered.push(departures[i]);
          }
          if (filtered.length >= config.maximum) break;
        }

        if (!filtered.length) {
          document.getElementById(targetId).innerHTML =
            '<div class="error">No matching departures found.</div>';
          return;
        }

        var html = '<table class="departures">';
        for (i = 0; i < filtered.length; i++) {
          var departure = filtered[i];
          var minutes = minutesUntil(departureDate(departure));
          var delay = delayMinutes(departure);

          html +=
            "<tr>" +
              '<td class="line">' + escapeHTML(lineName(departure)) + "</td>" +
              '<td class="destination">' +
                escapeHTML(destinationName(departure)) +
              "</td>" +
              '<td class="minutes">' +
                (minutes === 0 ? "jetzt" : minutes + " Min.") +
                (delay > 0 ?
                  '<span class="late">+' + delay + " min</span>" : "") +
              "</td>" +
            "</tr>";

        html += "</table>";

        document.getElementById(targetId).innerHTML = html;

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function efaDateTime(value) {
        if (!value) return null;
        if (typeof value === "string") return value;

        if (value.date && value.time) {
          return value.date + "T" + value.time;
        }

        if (typeof value === "object" &&
            value.year && value.month && value.day &&
            (value.hour || value.hour === 0) &&
            (value.minute || value.minute === 0)) {
          return (
            value.year + "-" +
            pad(Number(value.month)) + "-" +
            pad(Number(value.day)) + "T" +
            pad(Number(value.hour)) + ":" +
            pad(Number(value.minute)) + ":00"
          );
        }

        return null;
      }

      function efaModeFromClass(rawClass) {
        var value = Number(rawClass);
        if (!isNaN(value)) {
          if (value === 2 || value === 3) return "subway";
          if (value === 4) return "tram";
          if ((value >= 5 && value <= 8) || value === 11) return "bus";
          if (value === 0 || value === 1 || value === 13 || value === 15 || value === 16) {
            return "train";
          }
        }
        return "";
      }

      function normalizeEFADeparture(rawDeparture) {
        var line = rawDeparture.transportation ||
          rawDeparture.servingLine ||
          rawDeparture.line ||
          {};

        var product = line.product || {};
        var mode = "";

        if (product.name) {
          mode = String(product.name).toLowerCase();
        } else if (product.class || product.class === 0) {
          mode = efaModeFromClass(product.class);
        } else if (line.mode) {
          mode = String(line.mode).toLowerCase();
        } else if (line.trainType) {
          mode = String(line.trainType).toLowerCase();
        } else if (line.type) {
          mode = String(line.type).toLowerCase();
        } else if (line.motType) {
          mode = String(line.motType).toLowerCase();
        } else if (line.class || line.classId) {
          mode = efaModeFromClass(line.class || line.classId);
        }

        var plannedWhen = efaDateTime(
          rawDeparture.departureTimePlanned ||
          rawDeparture.plannedWhen ||
          rawDeparture.plannedDeparture ||
          rawDeparture.dateTime ||
          rawDeparture.dateTimePlanned ||
          rawDeparture.stopDateTime &&
            (rawDeparture.stopDateTime.planned || rawDeparture.stopDateTime.scheduled)
        );

        var when = efaDateTime(
          rawDeparture.departureTimeEstimated ||
          rawDeparture.when ||
          rawDeparture.departure ||
          rawDeparture.realDateTime ||
          rawDeparture.dateTimeEstimated ||
          rawDeparture.stopDateTime && rawDeparture.stopDateTime.estimated
        ) || plannedWhen;

        var delay = 0;
        if (typeof rawDeparture.delay === "number") {
          delay = rawDeparture.delay;
        } else if (typeof rawDeparture.delayMinutes === "number") {

              0,
              Math.round(
                (parsedWhen.getTime() - parsedPlannedWhen.getTime()) / 60000
              )
            );
          }
        }

        return {
          line: {
            name: line.number || line.disassembledName ||
              line.name || line.symbol || line.id || "—",
            product: mode,
            mode: mode
          },
          direction:
            line.destination &&
              (line.destination.name || line.destination) ||
            rawDeparture.direction ||
            rawDeparture.destination &&
              (rawDeparture.destination.name || rawDeparture.destination) ||
            line.direction ||
            "Unbekanntes Ziel",
          when: when,
          plannedWhen: plannedWhen,
          delayMinutes: delay
        };
      }

      function extractLocations(response) {

        if (Array.isArray(response)) return response;
        if (Array.isArray(response.locations)) return response.locations;
        if (response.locations && Array.isArray(response.locations.points)) {

        if (response.locations && Array.isArray(response.locations.location)) {

      function locationType(location) {

      function extractDepartures(response) {
        if (!response) return [];

        if (Array.isArray(response.departureList)) {
          return response.departureList;
        }
        if (response.departureList &&
            Array.isArray(response.departureList.departure)) {
          return response.departureList.departure;
        }
        if (Array.isArray(response.departures)) {
          return response.departures;
        }
        if (Array.isArray(response.stopEvents)) {
          return response.stopEvents;
        }
        if (response.dm && Array.isArray(response.dm.points)) {
          return response.dm.points;
        }
        if (Array.isArray(response)) {
          return response;
        }

        return [];

      function resolveStop(config, callback) {
        if (resolvedStops[config.query]) {
          callback(null, resolvedStops[config.query]);
          return;
        }

        var url =
          TRANSPORT_BASE + "/XML_STOPFINDER_REQUEST" +
          "?outputFormat=RapidJSON" +
          "&locationServerActive=1" +
          "&type_sf=stop" +
          "&name_sf=" + encodeURIComponent(config.query);

        requestJSON(url, function (error, response) {
          var locations = extractLocations(response);
          if (error || !locations.length) {
            callback(error || new Error("Haltestelle nicht gefunden"));
            return;
          }

          var selected = null;
          var i;

          for (i = 0; i < locations.length; i++) {
            var currentType = locationType(locations[i]);
            if (!currentType ||
                currentType === "stop" ||
                currentType === "station" ||
                currentType === "platform") {
              selected = locations[i];
              break;
            }
          }

          if (!selected && locations.length) {
            selected = locations[0];
          }

          var selectedId = selected && locationId(selected);
          if (!selectedId) {
            callback(new Error("Haltestelle nicht gefunden"));
            return;
          }

          resolvedStops[config.query] = selectedId;
          callback(null, selectedId);
        });
      }

      function loadStop(config) {
        resolveStop(config, function (error, stopId) {
          if (error) {
            document.getElementById(config.target).innerHTML =
              '<div class="error">Stop could not be found.</div>';
            return;
          }

          var url =
            TRANSPORT_BASE + "/XML_DM_REQUEST" +
            "?outputFormat=RapidJSON" +
            "&stateless=1" +
            "&type_dm=any" +
            "&name_dm=" + encodeURIComponent(stopId) +
            "&mode=direct" +
            "&useRealtime=1" +
            "&limit=30";

          requestJSON(url, function (departureError, response) {
            if (departureError || !response) {
              document.getElementById(config.target).innerHTML =
                '<div class="error">Departures unavailable.</div>';
              return;
            }

            var departures = [];
            var rawDepartures = extractDepartures(response);
            var i;
            for (i = 0; i < rawDepartures.length; i++) {
              departures.push(normalizeEFADeparture(rawDepartures[i]));
            }

            renderDepartures(config.target, departures, config);
            setUpdated();
          });
        });
      }

      function loadTransport() {

      }

      }

      function driftForScreenProtection() {

      if (!(typeof window !== "undefined" && window.__HOME_DASHBOARD_TEST__)) {

          }, false);

        setInterval(updateClock, 1000);
        setInterval(loadTransport, 60000);
        setInterval(loadWeather, 900000);
        setInterval(loadHolidays, 21600000);
        setInterval(driftForScreenProtection, 300000);
      }
    }());
  </script>
